<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fusco Foods Pricing</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .tier-recipe { background:#ecfdf5; color:#047857; border-color:#a7f3d0; }
  .tier-confirmed { background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
  .tier-placeholder { background:#fffbeb; color:#92400e; border-color:#fde68a; }
  .tab-btn.active { background:#0f172a; color:#fff; }
</style>
</head>
<body class="bg-slate-50 text-slate-900">

<div id="app" class="max-w-6xl mx-auto p-6"></div>

<script>
const SUPABASE_URL = "https://okpknfmjdqbtlwefblkn.supabase.co";
const SUPABASE_KEY = "sb_publishable_CZW9g1QXxkccqZ5y3qMM4Q_pSQb6rGw";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let state = {
  tab: "pricing",
  mode: "actual",
  products: [],
  customers: [],
  materials: [],
  uoms: [],
  materialCosts: {},
  productCode: null,
  customerId: null,
  productQuery: null,
  customerQuery: null,
  testPrice: "",
  testVolume: "",
  basket: [],
};

function money(n) { return "\u20ac" + (Number(n) || 0).toFixed(2); }
function money4(n) { return "\u20ac" + (Number(n) || 0).toFixed(4); }
function pct(n) { return ((Number(n) || 0) * 100).toFixed(1) + "%"; }
function el(id) { return document.getElementById(id); }

async function loadAll() {
  const [{ data: products }, { data: customers }, { data: materials }] = await Promise.all([
    sb.from("products").select("*").order("code"),
    sb.from("customers").select("*").order("name"),
    sb.from("materials").select("*").order("code"),
  ]);
  state.products = products || [];
  state.customers = customers || [];
  state.materials = materials || [];
  const [{ data: uoms }, { data: currentCosts }] = await Promise.all([
    sb.from("units_of_measure").select("*").order("sort_order"),
    sb.from("material_current_cost").select("*"),
  ]);
  state.uoms = uoms || [];
  state.materialCosts = {};
  (currentCosts || []).forEach((c) => { state.materialCosts[c.material_code] = c; });
  if (!state.productCode && state.products.length) state.productCode = state.products[0].code;
  if (!state.customerId && state.customers.length) state.customerId = state.customers[0].id;
}

// ---------- cost calculation ----------
async function costBuildUp(productCode) {
  const product = state.products.find((p) => p.code === productCode);
  if (!product) return null;
  const site = product.site_id;

  const { data: costs } = await sb.from("product_costs").select("*").eq("product_code", productCode);
  const ingredientRow = (costs || []).find((c) => c.cost_type === "ingredient");
  const packagingRow = (costs || []).find((c) => c.cost_type === "packaging");

  async function tierValue(row, costType) {
    if (!row) return { value: 0, tier: "placeholder", note: "No cost entered yet" };
    if (row.tier === "recipe") {
      const { data: lines } = await sb
        .from("recipe_lines")
        .select("quantity_per_batch, material_code")
        .eq("product_code", productCode);
      const total = (lines || []).reduce((s, l) => {
        const c = state.materialCosts[l.material_code];
        return s + (l.quantity_per_batch || 0) * (c ? Number(c.cost_per_unit) : 0);
      }, 0);
      const withWastage = costType === "ingredient" ? total * (1 + (product.wastage_pct || 0)) : total;
      return { value: withWastage, tier: "recipe", note: "From recipe" };
    }
    return { value: row.value || 0, tier: row.tier, note: row.tier === "confirmed" ? (row.source || "Confirmed") : `Estimated by ${row.entered_by || "?"} (${row.entered_at ? row.entered_at.slice(0, 10) : "?"})` };
  }

  const ingredient = await tierValue(ingredientRow, "ingredient");
  const packaging = await tierValue(packagingRow, "packaging");

  // labour + units produced (site-specific)
  let labourValue = 0, unitsProduced = 0, labourNote = "No labour data yet";
  if (site === "kilcoole") {
    const { data: periods } = await sb
      .from("kilcoole_labour_periods")
      .select("*")
      .eq("product_code", productCode)
      .order("created_at", { ascending: false })
      .limit(1);
    if (periods && periods.length) {
      const p = periods[0];
      unitsProduced = p.quantity_produced;
      labourValue = p.total_labour_cost / p.quantity_produced;
      labourNote = `${money(p.total_labour_cost)} \u00f7 ${p.quantity_produced} units (${p.period_label})`;
    }
  } else {
    const [{ data: phases }, { data: outputRows }] = await Promise.all([
      sb.from("stillorgan_labour_phases").select("*").eq("product_code", productCode),
      sb.from("stillorgan_expected_output").select("*").eq("product_code", productCode).limit(1),
    ]);
    const output = outputRows && outputRows[0] ? outputRows[0].expected_output : 0;
    if (phases && phases.length && output) {
      const total = phases.reduce((s, ph) => s + ph.hours * ph.rate_per_hour, 0);
      unitsProduced = output;
      labourValue = total / output;
      labourNote = phases.map((ph) => `${ph.phase_name} ${ph.hours}h\u00d7${money(ph.rate_per_hour)}`).join(" + ") + ` \u00f7 ${output} expected output`;
    }
  }

  // overhead rates (mode-aware)
  const { data: ohRows } = await sb.from("overhead_rates").select("*").eq("site_id", site).eq("mode", state.mode);
  const oh = {};
  (ohRows || []).forEach((r) => { oh[r.cost_type] = r.avg_monthly_units ? r.monthly_cost / r.avg_monthly_units : 0; });

  // fixed overhead (day-based, real % split)
  const { data: fixedRows } = await sb.from("fixed_costs").select("*");
  let fixedAllocated = 0;
  (fixedRows || []).forEach((r) => {
    const sPct = r.stillorgan_pct ?? 0.5;
    fixedAllocated += r.monthly_amount * (site === "stillorgan" ? sPct : (1 - sPct));
  });
  const { data: daysRow } = await sb.from("production_days_per_week").select("*").eq("site_id", site).single();
  const daysPerMonth = (daysRow?.days || 5) * 52 / 12;
  const dailyFixedRate = fixedAllocated / daysPerMonth;
  const fixedOHPerUnit = unitsProduced ? dailyFixedRate / unitsProduced : 0;

  // storage
  const { data: storageSettings } = await sb.from("storage_settings").select("*").single();
  const storageValue = product.storage_rate_override ?? storageSettings?.default_rate ?? 0;

  const lines = [
    { label: "Ingredient", value: ingredient.value, tier: ingredient.tier, note: ingredient.note },
    { label: "Packaging", value: packaging.value, tier: packaging.tier, note: packaging.note },
    { label: "Labour", value: labourValue, tier: "calculated", note: labourNote },
    { label: "Electricity", value: oh.electricity || 0, tier: "overhead" },
    { label: "Gas", value: oh.gas || 0, tier: "overhead" },
    { label: "Cleaning", value: oh.cleaning || 0, tier: "overhead" },
    { label: "Maintenance", value: oh.maintenance || 0, tier: "overhead" },
    { label: "Fixed overhead", value: fixedOHPerUnit, tier: "overhead" },
    { label: "Storage", value: storageValue, tier: "overhead" },
  ];
  const total = lines.reduce((s, l) => s + l.value, 0);
  return { product, lines, total };
}

// ---------- rendering ----------
function tierBadge(tier, note) {
  if (tier === "calculated" || tier === "overhead") return "";
  const cls = "tier-" + tier;
  const label = tier === "recipe" ? "From recipe" : tier === "confirmed" ? "Confirmed" : "Estimated";
  return `<span class="text-xs px-2 py-0.5 rounded border ${cls}" title="${note || ""}">${label}</span>`;
}

async function renderPricing() {
  const container = el("app");
  const product = state.products.find((p) => p.code === state.productCode);
  const customer = state.customers.find((c) => c.id === state.customerId);
  if (!product || !customer) {
    container.innerHTML = renderShell(`<p class="text-sm text-slate-500">Add at least one product and one customer first (see the Products / Customers tabs).</p>`);
    return;
  }
  const build = await costBuildUp(state.productCode);
  const listPrice = product.selling_price || 0;
  const netPrice = listPrice * (1 - customer.rebate_pct);
  const contribution = netPrice - build.total - customer.delivery_rate;
  const margin = netPrice ? contribution / netPrice : 0;

  const priceUsed = state.testPrice ? parseFloat(state.testPrice) : listPrice;
  const netAtTest = priceUsed * (1 - customer.rebate_pct);
  const contribAtTest = netAtTest - build.total - customer.delivery_rate;
  const marginAtTest = netAtTest ? contribAtTest / netAtTest : 0;
  const volumeNum = parseFloat(state.testVolume) || 0;

  const prodQuery = state.productQuery ?? `${product.code} \u2014 ${product.description}`;
  const custQuery = state.customerQuery ?? customer.name;
  const prodMatches = state.productQuery
    ? state.products.filter((p) => `${p.code} ${p.description}`.toLowerCase().includes(state.productQuery.toLowerCase())).slice(0, 12)
    : [];
  const custMatches = state.customerQuery
    ? state.customers.filter((c) => c.name.toLowerCase().includes(state.customerQuery.toLowerCase())).slice(0, 12)
    : [];
  const prodDropdown = prodMatches.length
    ? `<div class="absolute z-10 w-full bg-white border border-slate-200 rounded-md mt-1 shadow-sm max-h-60 overflow-y-auto">
        ${prodMatches.map((p) => `<div data-pick-product="${p.code}" class="px-2 py-1.5 text-sm hover:bg-slate-100 cursor-pointer">${p.code} \u2014 ${p.description}</div>`).join("")}
      </div>` : "";
  const custDropdown = custMatches.length
    ? `<div class="absolute z-10 w-full bg-white border border-slate-200 rounded-md mt-1 shadow-sm max-h-60 overflow-y-auto">
        ${custMatches.map((c) => `<div data-pick-customer="${c.id}" class="px-2 py-1.5 text-sm hover:bg-slate-100 cursor-pointer">${c.name}</div>`).join("")}
      </div>` : "";

  const costLines = build.lines.map((l) => `
    <div class="flex items-center justify-between text-sm py-0.5">
      <span class="flex items-center gap-2 text-slate-600">${l.label} ${tierBadge(l.tier, l.note)}</span>
      <span class="tabular-nums">${money4(l.value)}</span>
    </div>`).join("");

  const basketRowsHtml = await renderBasketRows();

  container.innerHTML = renderShell(`
    <div class="grid grid-cols-2 gap-6">
      <div class="bg-white border border-slate-200 rounded-xl p-5 space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div class="relative">
            <label class="text-xs text-slate-500">Product</label>
            <input id="sel-product" type="text" value="${prodQuery.replace(/"/g, "&quot;")}" placeholder="Type a code or name\u2026" autocomplete="off" class="w-full mt-1 border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
            ${prodDropdown}
          </div>
          <div class="relative">
            <label class="text-xs text-slate-500">Customer</label>
            <input id="sel-customer" type="text" value="${custQuery.replace(/"/g, "&quot;")}" placeholder="Type a customer name\u2026" autocomplete="off" class="w-full mt-1 border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
            ${custDropdown}
          </div>
        </div>
        <p class="text-xs text-slate-500 capitalize">${product.site_id} \u00b7 mode: ${state.mode}</p>
        <div class="border-t border-slate-100 pt-2">${costLines}
          <div class="flex justify-between text-sm font-medium border-t border-slate-100 pt-1.5 mt-1">
            <span>Total variable cost / unit</span><span class="tabular-nums">${money(build.total)}</span>
          </div>
        </div>
        <div class="border-t border-slate-100 pt-2 space-y-1 text-sm">
          <div class="flex justify-between"><span class="text-slate-600">List price</span><span>${money(listPrice)}</span></div>
          <div class="flex justify-between"><span class="text-slate-600">Rebate</span><span>${pct(customer.rebate_pct)}</span></div>
          <div class="flex justify-between"><span class="text-slate-600">Delivery</span><span>${money4(customer.delivery_rate)}</span></div>
          <div class="flex justify-between font-medium"><span>Net price</span><span>${money(netPrice)}</span></div>
          <div class="flex justify-between font-medium"><span>Contribution</span><span class="${contribution < 0 ? "text-red-600" : "text-emerald-600"}">${money(contribution)}</span></div>
          <div class="flex justify-between font-medium"><span>Margin</span><span class="${margin < 0 ? "text-red-600" : "text-emerald-600"}">${pct(margin)}</span></div>
        </div>
        <button id="btn-add-basket" class="w-full text-sm bg-slate-900 text-white rounded-md py-2 hover:bg-slate-800">Add to quote basket</button>
      </div>

      <div class="bg-white border border-slate-200 rounded-xl p-5 space-y-3">
        <h2 class="text-sm font-medium text-slate-700">Test a different price</h2>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs text-slate-500">Test price</label>
            <input id="in-test-price" type="number" step="0.01" value="${state.testPrice}" placeholder="${listPrice.toFixed(2)}" class="w-full mt-1 border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
          <div><label class="text-xs text-slate-500">Test volume</label>
            <input id="in-test-volume" type="number" value="${state.testVolume}" placeholder="0" class="w-full mt-1 border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        </div>
        <div class="space-y-1 text-sm">
          <div class="flex justify-between"><span class="text-slate-600">Price used</span><span>${money(priceUsed)}</span></div>
          <div class="flex justify-between"><span class="text-slate-600">Net price at test</span><span>${money(netAtTest)}</span></div>
          <div class="flex justify-between font-medium"><span>Contribution / unit</span><span class="${contribAtTest < 0 ? "text-red-600" : "text-emerald-600"}">${money(contribAtTest)}</span></div>
          <div class="flex justify-between font-medium"><span>Margin at test</span><span class="${marginAtTest < 0 ? "text-red-600" : "text-emerald-600"}">${pct(marginAtTest)}</span></div>
          ${volumeNum > 0 ? `<div class="flex justify-between font-medium border-t border-slate-100 pt-1"><span>Total contribution at volume</span><span>${money(contribAtTest * volumeNum)}</span></div>` : ""}
        </div>
      </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-xl p-5 mt-6">
      <h2 class="text-sm font-medium text-slate-700 mb-3">Quote basket</h2>
      ${basketRowsHtml}
    </div>
  `);

  const prodInput = el("sel-product");
  prodInput.oninput = (e) => {
    state.productQuery = e.target.value;
    const caret = e.target.selectionStart;
    renderPricing().then(() => {
      const again = el("sel-product");
      if (again) { again.focus(); again.setSelectionRange(caret, caret); }
    });
  };
  const custInput = el("sel-customer");
  custInput.oninput = (e) => {
    state.customerQuery = e.target.value;
    const caret = e.target.selectionStart;
    renderPricing().then(() => {
      const again = el("sel-customer");
      if (again) { again.focus(); again.setSelectionRange(caret, caret); }
    });
  };
  document.querySelectorAll("[data-pick-product]").forEach((d) => {
    d.onmousedown = (ev) => {
      ev.preventDefault();
      state.productCode = d.dataset.pickProduct;
      state.productQuery = null;
      renderPricing();
    };
  });
  document.querySelectorAll("[data-pick-customer]").forEach((d) => {
    d.onmousedown = (ev) => {
      ev.preventDefault();
      state.customerId = d.dataset.pickCustomer;
      state.customerQuery = null;
      renderPricing();
    };
  });
  el("in-test-price").oninput = (e) => { state.testPrice = e.target.value; renderPricing(); };
  el("in-test-volume").oninput = (e) => { state.testVolume = e.target.value; renderPricing(); };
  el("btn-add-basket").onclick = () => {
    state.basket.push({ id: Date.now(), productCode: state.productCode, customerId: state.customerId, quantity: 100, discount: 0 });
    renderPricing();
  };
  document.querySelectorAll("[data-remove-basket]").forEach((b) => {
    b.onclick = () => { state.basket = state.basket.filter((l) => l.id != b.dataset.removeBasket); renderPricing(); };
  });
  document.querySelectorAll("[data-basket-qty]").forEach((inp) => {
    inp.onchange = () => {
      const line = state.basket.find((l) => l.id == inp.dataset.basketQty);
      if (line) line.quantity = parseFloat(inp.value) || 0;
      renderPricing();
    };
  });
  document.querySelectorAll("[data-basket-discount]").forEach((inp) => {
    inp.onchange = () => {
      const line = state.basket.find((l) => l.id == inp.dataset.basketDiscount);
      if (line) line.discount = (parseFloat(inp.value) || 0) / 100;
      renderPricing();
    };
  });
}

async function renderBasketRows() {
  if (!state.basket.length) return `<p class="text-sm text-slate-400">No lines yet.</p>`;
  const rows = [];
  let totalValue = 0, totalQty = 0, totalCostQty = 0, totalDeliveryQty = 0;
  for (const line of state.basket) {
    const product = state.products.find((p) => p.code === line.productCode);
    const customer = state.customers.find((c) => c.id === line.customerId);
    const build = await costBuildUp(line.productCode);
    const finalPrice = (product.selling_price || 0) * (1 - customer.rebate_pct) * (1 - (line.discount || 0));
    const contrib = finalPrice - build.total - customer.delivery_rate;
    const marginPct = finalPrice ? contrib / finalPrice : 0;
    const lineValue = finalPrice * line.quantity;
    totalValue += lineValue; totalQty += line.quantity;
    totalCostQty += build.total * line.quantity;
    totalDeliveryQty += customer.delivery_rate * line.quantity;
    rows.push(`<tr class="border-b border-slate-50">
      <td class="py-2">${product.description}</td>
      <td class="py-2">${customer.name}</td>
      <td class="py-2 text-right"><input data-basket-qty="${line.id}" type="number" value="${line.quantity}" class="w-16 border border-slate-200 rounded px-1 py-0.5 text-right text-sm" /></td>
      <td class="py-2 text-right"><input data-basket-discount="${line.id}" type="number" step="0.01" value="${((line.discount || 0) * 100).toFixed(2).replace(/\.00$/, "")}" class="w-14 border border-slate-200 rounded px-1 py-0.5 text-right text-sm" /></td>
      <td class="py-2 text-right tabular-nums text-sm">${money(finalPrice)}</td>
      <td class="py-2 text-right tabular-nums text-sm">${money(build.total)}</td>
      <td class="py-2 text-right tabular-nums text-sm ${marginPct < 0 ? "text-red-600" : "text-emerald-600"}">${pct(marginPct)}</td>
      <td class="py-2 text-right tabular-nums text-sm">${money(lineValue)}</td>
      <td class="py-2 text-right"><button data-remove-basket="${line.id}" class="text-xs text-slate-400 hover:text-red-600">remove</button></td>
    </tr>`);
  }
  const blendedMargin = totalValue ? (totalValue - totalCostQty - totalDeliveryQty) / totalValue : 0;
  return `
    <div class="text-xs text-slate-500 mb-2">${totalQty.toLocaleString()} units \u00b7 blended margin ${pct(blendedMargin)}</div>
    <table class="w-full text-sm">
      <thead><tr class="text-left text-xs text-slate-500 border-b border-slate-100">
        <th class="font-normal pb-2">Product</th><th class="font-normal pb-2">Customer</th>
        <th class="font-normal pb-2 text-right">Qty</th><th class="font-normal pb-2 text-right">Discount %</th>
        <th class="font-normal pb-2 text-right">Final price</th><th class="font-normal pb-2 text-right">Cost</th>
        <th class="font-normal pb-2 text-right">Margin</th><th class="font-normal pb-2 text-right">Line value</th><th></th>
      </tr></thead>
      <tbody>${rows.join("")}</tbody>
    </table>`;
}

function renderShell(inner) {
  const tabs = ["pricing", "products", "customers", "materials", "purchases", "costs", "recipes", "labour", "settings"];
  const tabBtns = tabs.map((t) => `<button data-tab="${t}" class="tab-btn px-3 py-1.5 text-sm rounded-md capitalize ${state.tab === t ? "active" : "text-slate-600 hover:bg-slate-100"}">${t}</button>`).join("");
  return `
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl font-semibold">Fusco Foods pricing</h1>
        <p class="text-sm text-slate-500">Connected to Supabase \u2014 live data</p>
      </div>
      <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-lg p-1">
        <button data-mode="actual" class="px-3 py-1.5 text-sm rounded-md ${state.mode === "actual" ? "bg-slate-900 text-white" : "text-slate-600 hover:bg-slate-100"}">Actual</button>
        <button data-mode="budgeted" class="px-3 py-1.5 text-sm rounded-md ${state.mode === "budgeted" ? "bg-slate-900 text-white" : "text-slate-600 hover:bg-slate-100"}">Budgeted</button>
      </div>
    </div>
    <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-lg p-1 mb-6 w-fit">${tabBtns}</div>
    ${inner}
  `;
}

function attachShellHandlers() {
  document.querySelectorAll("[data-tab]").forEach((b) => {
    b.onclick = () => { state.tab = b.dataset.tab; render(); };
  });
  document.querySelectorAll("[data-mode]").forEach((b) => {
    b.onclick = () => { state.mode = b.dataset.mode; render(); };
  });
}

// ---------- simple CRUD tabs ----------
async function renderProducts() {
  const rows = state.products.map((p) => `
    <tr class="border-b border-slate-50 text-sm">
      <td class="py-2">${p.code}</td>
      <td class="py-2">${p.description}</td>
      <td class="py-2 text-right">${money(p.selling_price || 0)}</td>
      <td class="py-2 capitalize">${p.site_id}</td>
    </tr>`).join("");
  el("app").innerHTML = renderShell(`
    <div class="bg-white border border-slate-200 rounded-xl p-5 mb-6">
      <h2 class="text-sm font-medium mb-3">Add a product</h2>
      <form id="form-product" class="grid grid-cols-5 gap-2 items-end">
        <div><label class="text-xs text-slate-500">Code</label><input name="code" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-500">Description</label><input name="description" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-500">Selling price</label><input name="selling_price" type="number" step="0.01" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-500">Site</label>
          <select name="site_id" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm"><option value="stillorgan">Stillorgan</option><option value="kilcoole">Kilcoole</option></select>
        </div>
        <button class="bg-slate-900 text-white rounded-md py-1.5 text-sm">Add</button>

// ---------- Costs tab: the three-tier ingredient/packaging cost ----------
async function renderCosts() {
  const { data: allCosts } = await sb.from("product_costs").select("*");
  const costFor = (code, type) => (allCosts || []).find((c) => c.product_code === code && c.cost_type === type);

  const rows = state.products.map((p) => {
    const ing = costFor(p.code, "ingredient");
    const pkg = costFor(p.code, "packaging");
    const cell = (row, type) => {
      if (!row) return `<span class="text-slate-400 text-xs">not set</span>`;
      const badge = tierBadge(row.tier, row.source || row.entered_by || "");
      const val = row.tier === "recipe" ? `<span class="text-xs text-slate-500">from recipe</span>` : money4(row.value || 0);
      const promote = row.tier === "placeholder"
        ? `<button data-promote="${p.code}:${type}" class="text-xs text-blue-600 hover:underline ml-2">confirm</button>` : "";
      return `${val} ${badge}${promote}`;
    };
    return `<tr class="border-b border-slate-50 text-sm">
      <td class="py-2">${p.code}</td>
      <td class="py-2">${p.description}</td>
      <td class="py-2">${cell(ing, "ingredient")}</td>
      <td class="py-2">${cell(pkg, "packaging")}</td>
      <td class="py-2 text-right">${pct(p.wastage_pct || 0)}</td>
    </tr>`;
  }).join("");

  const productOpts = state.products.map((p) => `<option value="${p.code}">${p.code} \u2014 ${p.description}</option>`).join("");

  el("app").innerHTML = renderShell(`
    <div class="bg-white border border-slate-200 rounded-xl p-5 mb-6">
      <h2 class="text-sm font-medium mb-1">Set a cost</h2>
      <p class="text-xs text-slate-500 mb-3">Choose "From recipe" to calculate from the Recipes tab instead of typing a figure. "Estimated" is a rough guess and is flagged everywhere it's used.</p>
      <form id="form-cost" class="grid grid-cols-6 gap-2 items-end">
        <div><label class="text-xs text-slate-500">Product</label><select name="product_code" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm">${productOpts}</select></div>
        <div><label class="text-xs text-slate-500">Cost type</label><select name="cost_type" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm"><option value="ingredient">Ingredient</option><option value="packaging">Packaging</option></select></div>
        <div><label class="text-xs text-slate-500">Tier</label><select name="tier" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm"><option value="confirmed">Confirmed</option><option value="placeholder">Estimated</option><option value="recipe">From recipe</option></select></div>
        <div><label class="text-xs text-slate-500">Value \u20ac/unit</label><input name="value" type="number" step="0.0001" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-500">Source / who</label><input name="source" placeholder="e.g. Alex sheet" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <button class="bg-slate-900 text-white rounded-md py-1.5 text-sm">Save</button>
      </form>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-5 mb-6">
      <h2 class="text-sm font-medium mb-3">Wastage % (applies to recipe-costed ingredients)</h2>
      <form id="form-wastage" class="grid grid-cols-3 gap-2 items-end">
        <div><label class="text-xs text-slate-500">Product</label><select name="product_code" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm">${productOpts}</select></div>
        <div><label class="text-xs text-slate-500">Wastage %</label><input name="wastage_pct" type="number" step="0.01" placeholder="3" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <button class="bg-slate-900 text-white rounded-md py-1.5 text-sm">Save</button>
      </form>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <table class="w-full"><thead><tr class="text-left text-xs text-slate-500 border-b border-slate-100">
        <th class="font-normal pb-2">Code</th><th class="font-normal pb-2">Product</th>
        <th class="font-normal pb-2">Ingredient</th><th class="font-normal pb-2">Packaging</th><th class="font-normal pb-2 text-right">Wastage</th>
      </tr></thead><tbody>${rows}</tbody></table>
    </div>`);
  attachShellHandlers();

  el("form-cost").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const tier = f.get("tier");
    await sb.from("product_costs").upsert({
      product_code: f.get("product_code"),
      cost_type: f.get("cost_type"),
      tier: tier,
      value: tier === "recipe" ? null : (parseFloat(f.get("value")) || 0),
      source: tier === "confirmed" ? (f.get("source") || null) : null,
      entered_by: tier === "placeholder" ? (f.get("source") || null) : null,
      confirmed_by: null, confirmed_at: null,
    }, { onConflict: "product_code,cost_type" });
    renderCosts();
  };
  el("form-wastage").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await sb.from("products").update({ wastage_pct: (parseFloat(f.get("wastage_pct")) || 0) / 100 }).eq("code", f.get("product_code"));
    await loadAll(); renderCosts();
  };
  document.querySelectorAll("[data-promote]").forEach((b) => {
    b.onclick = async () => {
      const [code, type] = b.dataset.promote.split(":");
      await sb.from("product_costs").update({ tier: "confirmed", confirmed_by: "app user", confirmed_at: new Date().toISOString() })
        .eq("product_code", code).eq("cost_type", type);
      renderCosts();
    };
  });
}

    <td class="py-2">${r.product_code}</td><td class="py-2">${r.phase_name}</td>
    <td class="py-2 text-right">${r.hours}</td><td class="py-2 text-right">${money(r.rate_per_hour)}</td>
    <td class="py-2 text-right">${money(r.hours * r.rate_per_hour)}</td>
    <td class="py-2 text-right"><button data-del-st="${r.id}" class="text-xs text-slate-400 hover:text-red-600">remove</button></td>
  </tr>`).join("");

  const outRows = (outputs || []).map((r) => `<tr class="border-b border-slate-50 text-sm">
    <td class="py-2">${r.product_code}</td><td class="py-2 text-right">${r.expected_output.toLocaleString()}</td>
  </tr>`).join("");

  el("app").innerHTML = renderShell(`
    <div class="bg-white border border-slate-200 rounded-xl p-5 mb-6">
      <h2 class="text-sm font-medium mb-1">Kilcoole \u2014 period labour</h2>
      <p class="text-xs text-slate-500 mb-3">One product runs a whole period, so labour/unit is the period's total cost \u00f7 quantity produced. The most recent entry per product is the one used.</p>
      <form id="form-kc" class="grid grid-cols-5 gap-2 items-end">
        <div><label class="text-xs text-slate-500">Product</label><select name="product_code" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm">${kcOpts || "<option value=''>No Kilcoole products</option>"}</select></div>
        <div><label class="text-xs text-slate-500">Period</label><input name="period_label" placeholder="w/c 01/06/26" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-500">Qty produced</label><input name="quantity_produced" type="number" step="1" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-500">Total labour \u20ac</label><input name="total_labour_cost" type="number" step="0.01" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <button class="bg-slate-900 text-white rounded-md py-1.5 text-sm">Add</button>
      </form>
      <table class="w-full mt-4"><thead><tr class="text-left text-xs text-slate-500 border-b border-slate-100">
        <th class="font-normal pb-2">Product</th><th class="font-normal pb-2">Period</th><th class="font-normal pb-2 text-right">Qty</th>
        <th class="font-normal pb-2 text-right">Total labour</th><th class="font-normal pb-2 text-right">\u20ac/unit</th><th></th>
      </tr></thead><tbody>${kcRows || `<tr><td colspan="6" class="py-3 text-sm text-slate-400">Nothing yet.</td></tr>`}</tbody></table>
    </div>

    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <h2 class="text-sm font-medium mb-1">Stillorgan \u2014 process phases</h2>
      <p class="text-xs text-slate-500 mb-3">A day covers several products, so labour is built from phases and divided by expected output.</p>
      <form id="form-st" class="grid grid-cols-5 gap-2 items-end mb-4">
        <div><label class="text-xs text-slate-500">Product</label><select name="product_code" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm">${stOpts || "<option value=''>No Stillorgan products</option>"}</select></div>
        <div><label class="text-xs text-slate-500">Phase</label><input name="phase_name" placeholder="Mixing" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-500">Hours</label><input name="hours" type="number" step="0.01" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-500">Rate \u20ac/hr</label><input name="rate_per_hour" type="number" step="0.01" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <button class="bg-slate-900 text-white rounded-md py-1.5 text-sm">Add phase</button>
      </form>
      <table class="w-full mb-6"><thead><tr class="text-left text-xs text-slate-500 border-b border-slate-100">
        <th class="font-normal pb-2">Product</th><th class="font-normal pb-2">Phase</th><th class="font-normal pb-2 text-right">Hours</th>
        <th class="font-normal pb-2 text-right">Rate</th><th class="font-normal pb-2 text-right">Cost</th><th></th>
      </tr></thead><tbody>${stRows || `<tr><td colspan="6" class="py-3 text-sm text-slate-400">No phases yet.</td></tr>`}</tbody></table>

      <h3 class="text-sm font-medium mb-2">Expected output per product</h3>
      <form id="form-out" class="grid grid-cols-3 gap-2 items-end">
        <div><label class="text-xs text-slate-500">Product</label><select name="product_code" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm">${stOpts || "<option value=''>No Stillorgan products</option>"}</select></div>
        <div><label class="text-xs text-slate-500">Expected output (units)</label><input name="expected_output" type="number" step="1" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <button class="bg-slate-900 text-white rounded-md py-1.5 text-sm">Save</button>
      </form>
      <table class="w-full mt-3"><thead><tr class="text-left text-xs text-slate-500 border-b border-slate-100">
        <th class="font-normal pb-2">Product</th><th class="font-normal pb-2 text-right">Expected output</th>
      </tr></thead><tbody>${outRows || `<tr><td colspan="2" class="py-3 text-sm text-slate-400">Nothing yet.</td></tr>`}</tbody></table>
    </div>`);
  attachShellHandlers();

  el("form-kc").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await sb.from("kilcoole_labour_periods").insert({
      product_code: f.get("product_code"), period_label: f.get("period_label"),
      quantity_produced: parseFloat(f.get("quantity_produced")), total_labour_cost: parseFloat(f.get("total_labour_cost")),
    });
    renderLabour();
  };
  el("form-st").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await sb.from("stillorgan_labour_phases").insert({
      product_code: f.get("product_code"), phase_name: f.get("phase_name"),
      hours: parseFloat(f.get("hours")), rate_per_hour: parseFloat(f.get("rate_per_hour")),
    });
    renderLabour();
  };
  el("form-out").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await sb.from("stillorgan_expected_output").upsert({
      product_code: f.get("product_code"), expected_output: parseFloat(f.get("expected_output")),
    }, { onConflict: "product_code" });
    renderLabour();
  };
  document.querySelectorAll("[data-del-kc]").forEach((b) => {
    b.onclick = async () => { await sb.from("kilcoole_labour_periods").delete().eq("id", b.dataset.delKc); renderLabour(); };
  });
  document.querySelectorAll("[data-del-st]").forEach((b) => {
    b.onclick = async () => { await sb.from("stillorgan_labour_phases").delete().eq("id", b.dataset.delSt); renderLabour(); };
  });
}

// ---------- Settings tab: overheads, fixed costs, production days, storage ----------
async function renderSettings() {
  const [{ data: ohRows }, { data: fixedRows }, { data: daysRows }, { data: storage }] = await Promise.all([
    sb.from("overhead_rates").select("*").order("site_id").order("cost_type"),
    sb.from("fixed_costs").select("*").order("cost_item"),
    sb.from("production_days_per_week").select("*"),
    sb.from("storage_settings").select("*").single(),
  ]);

  const ohForMode = (ohRows || []).filter((r) => r.mode === state.mode);
  const ohHtml = ohForMode.map((r) => `<tr class="border-b border-slate-50 text-sm">
    <td class="py-2 capitalize">${r.site_id}</td><td class="py-2 capitalize">${r.cost_type}</td>
    <td class="py-2 text-right"><input data-oh-cost="${r.site_id}:${r.cost_type}" type="number" step="0.01" value="${r.monthly_cost}" class="w-24 border border-slate-200 rounded px-1 py-0.5 text-right text-sm" /></td>
    <td class="py-2 text-right"><input data-oh-units="${r.site_id}:${r.cost_type}" type="number" step="1" value="${r.avg_monthly_units}" class="w-24 border border-slate-200 rounded px-1 py-0.5 text-right text-sm" /></td>
    <td class="py-2 text-right font-medium">${money4(r.avg_monthly_units ? r.monthly_cost / r.avg_monthly_units : 0)}</td>
  </tr>`).join("");

  const fixedHtml = (fixedRows || []).map((r) => `<tr class="border-b border-slate-50 text-sm">
    <td class="py-2">${r.cost_item}</td>
    <td class="py-2 text-right">${money(r.monthly_amount)}</td>
    <td class="py-2 text-right">${pct(r.stillorgan_pct)}</td>
    <td class="py-2 text-right">${pct(1 - r.stillorgan_pct)}</td>
    <td class="py-2 text-right"><button data-del-fixed="${r.id}" class="text-xs text-slate-400 hover:text-red-600">remove</button></td>
  </tr>`).join("");
  const fixedTotal = (fixedRows || []).reduce((s, r) => s + Number(r.monthly_amount), 0);

  const daysHtml = (daysRows || []).map((r) => `<tr class="border-b border-slate-50 text-sm">
    <td class="py-2 capitalize">${r.site_id}</td>
    <td class="py-2 text-right"><input data-days="${r.site_id}" type="number" step="0.5" value="${r.days}" class="w-20 border border-slate-200 rounded px-1 py-0.5 text-right text-sm" /></td>
    <td class="py-2 text-right">${(r.days * 52 / 12).toFixed(1)}</td>
  </tr>`).join("");

  el("app").innerHTML = renderShell(`
    <div class="bg-white border border-slate-200 rounded-xl p-5 mb-6">
      <h2 class="text-sm font-medium mb-1">Volume-based overheads \u2014 <span class="capitalize">${state.mode}</span> mode</h2>
      <p class="text-xs text-slate-500 mb-3">Rate = monthly cost \u00f7 average monthly units produced. Switch mode with the toggle above to edit the other set.</p>
      <table class="w-full"><thead><tr class="text-left text-xs text-slate-500 border-b border-slate-100">
        <th class="font-normal pb-2">Site</th><th class="font-normal pb-2">Cost</th>
        <th class="font-normal pb-2 text-right">Monthly \u20ac</th><th class="font-normal pb-2 text-right">Avg monthly units</th>
        <th class="font-normal pb-2 text-right">\u20ac/unit</th>
      </tr></thead><tbody>${ohHtml}</tbody></table>
    </div>

    <div class="bg-white border border-slate-200 rounded-xl p-5 mb-6">
      <h2 class="text-sm font-medium mb-1">Fixed costs</h2>
      <p class="text-xs text-slate-500 mb-3">Spread by production days, not volume. Set each line's Stillorgan share \u2014 Kilcoole gets the rest.</p>
      <form id="form-fixed" class="grid grid-cols-4 gap-2 items-end mb-4">
        <div><label class="text-xs text-slate-500">Cost item</label><input name="cost_item" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-500">Monthly \u20ac</label><input name="monthly_amount" type="number" step="0.01" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-500">Stillorgan %</label><input name="stillorgan_pct" type="number" step="0.1" value="50" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <button class="bg-slate-900 text-white rounded-md py-1.5 text-sm">Add</button>
      </form>
      <table class="w-full"><thead><tr class="text-left text-xs text-slate-500 border-b border-slate-100">
        <th class="font-normal pb-2">Item</th><th class="font-normal pb-2 text-right">Monthly</th>
        <th class="font-normal pb-2 text-right">Stillorgan</th><th class="font-normal pb-2 text-right">Kilcoole</th><th></th>
      </tr></thead><tbody>${fixedHtml || `<tr><td colspan="5" class="py-3 text-sm text-slate-400">Nothing yet.</td></tr>`}</tbody>
      <tfoot><tr class="text-sm font-medium"><td class="pt-2">Total</td><td class="pt-2 text-right">${money(fixedTotal)}</td><td colspan="3"></td></tr></tfoot></table>
    </div>

    <div class="grid grid-cols-2 gap-6">
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-medium mb-3">Production days per week</h2>
        <table class="w-full"><thead><tr class="text-left text-xs text-slate-500 border-b border-slate-100">
          <th class="font-normal pb-2">Site</th><th class="font-normal pb-2 text-right">Days/week</th><th class="font-normal pb-2 text-right">Days/month</th>
        </tr></thead><tbody>${daysHtml}</tbody></table>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-medium mb-1">Storage</h2>
        <p class="text-xs text-slate-500 mb-3">Default \u20ac/unit, used unless a product has its own override.</p>
        <input id="in-storage" type="number" step="0.0001" value="${storage?.default_rate || 0}" class="w-32 border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
      </div>
    </div>`);
  attachShellHandlers();

  document.querySelectorAll("[data-oh-cost]").forEach((inp) => {
    inp.onchange = async () => {
      const [site, type] = inp.dataset.ohCost.split(":");
      await sb.from("overhead_rates").update({ monthly_cost: parseFloat(inp.value) || 0 }).eq("site_id", site).eq("mode", state.mode).eq("cost_type", type);
      renderSettings();
    };
  });
  document.querySelectorAll("[data-oh-units]").forEach((inp) => {
    inp.onchange = async () => {
      const [site, type] = inp.dataset.ohUnits.split(":");
      await sb.from("overhead_rates").update({ avg_monthly_units: parseFloat(inp.value) || 1 }).eq("site_id", site).eq("mode", state.mode).eq("cost_type", type);
      renderSettings();
    };
  });
  document.querySelectorAll("[data-days]").forEach((inp) => {
    inp.onchange = async () => {
      await sb.from("production_days_per_week").update({ days: parseFloat(inp.value) || 5 }).eq("site_id", inp.dataset.days);
      renderSettings();
    };
  });
  el("in-storage").onchange = async () => {
    await sb.from("storage_settings").update({ default_rate: parseFloat(el("in-storage").value) || 0 }).eq("id", true);
    renderSettings();
  };
  el("form-fixed").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await sb.from("fixed_costs").insert({
      cost_item: f.get("cost_item"),
      monthly_amount: parseFloat(f.get("monthly_amount")),
      stillorgan_pct: (parseFloat(f.get("stillorgan_pct")) || 0) / 100,
    });
    renderSettings();
  };
  document.querySelectorAll("[data-del-fixed]").forEach((b) => {
    b.onclick = async () => { await sb.from("fixed_costs").delete().eq("id", b.dataset.delFixed); renderSettings(); };
  });
}

async function render() {
  if (state.tab === "pricing") await renderPricing();
  else if (state.tab === "products") await renderProducts();
  else if (state.tab === "customers") await renderCustomers();
  else if (state.tab === "materials") await renderMaterials();
  else if (state.tab === "purchases") await renderPurchases();
  else if (state.tab === "costs") await renderCosts();
  else if (state.tab === "recipes") await renderRecipes();
  else if (state.tab === "labour") await renderLabour();
  else if (state.tab === "settings") await renderSettings();
  attachShellHandlers();
}

(async function init() {
  el("app").innerHTML = `<p class="text-slate-500 p-6">Loading\u2026</p>`;
  await loadAll();
  await render();
})();
</script>
</body>
</html>
