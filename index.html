function money(n) { return "\u20ac" + (Number(n) || 0).toFixed(2); }
function money4(n) { return "\u20ac" + (Number(n) || 0).toFixed(4); }
function pct(n) { return ((Number(n) || 0) * 100).toFixed(1) + "%"; }
function el(id) { return document.getElementById(id); }

async function loadAll() {
  const [{ data: products }, { data: customers }, { data: materials }] = await Promise.all([
    sb.from("products").select("*").order("code"),
    sb.from("customers").select("*").order("name"),
    sb.from("materials").select("*").order("code"),
  ]);
  state.products = products || [];
  state.customers = customers || [];
  state.materials = materials || [];
  const [{ data: uoms }, { data: currentCosts }] = await Promise.all([
    sb.from("units_of_measure").select("*").order("sort_order"),
    sb.from("material_current_cost").select("*"),
  ]);
  state.uoms = uoms || [];
  const { data: suppliers } = await sb.from("suppliers").select("*")
    .eq("inactive", false).eq("do_not_use", false).eq("is_placeholder", false)
    .order("name");
  state.suppliers = suppliers || [];
  state.materialCosts = {};
  (currentCosts || []).forEach((c) => { state.materialCosts[c.material_code] = c; });
  if (!state.productCode && state.products.length) state.productCode = state.products[0].code;
  if (!state.customerId && state.customers.length) state.customerId = state.customers[0].id;
}

// ---------- change history ----------
// Live tables always hold the current value; every change is also logged to
// value_history. First entry (no prior history) saves silently. A later change
// asks when it takes effect and whether it's a real change or a correction --
// a correction rewrites the period instead of opening a new one, so past
// reports come out right.

let sessionMode = null;   // {kind:'change'|'correction', until: timestamp}

function sessionModeActive() {
  if (!sessionMode) return null;
  if (Date.now() > sessionMode.until) { sessionMode = null; return null; }
  return sessionMode;
}

async function historyFor(entityType, entityKey, field) {
  const { data } = await sb.from("value_history").select("*")
    .eq("entity_type", entityType).eq("entity_key", entityKey).eq("field", field)
    .order("valid_from", { ascending: false }).order("changed_at", { ascending: false });
  return data || [];
}

function askChangeDetails(label, oldValue, newValue) {
  return new Promise((resolve) => {
    const active = sessionModeActive();
    if (active) {
      resolve({ date: new Date().toISOString().slice(0, 10), kind: active.kind, note: "" });
      return;
    }
    const wrap = document.createElement("div");
    wrap.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,.35);display:flex;align-items:center;justify-content:center;z-index:50";
    wrap.innerHTML = `
      <div class="bg-white rounded-xl p-5 w-[520px] shadow-lg">
        <h3 class="text-sm font-medium mb-1">Recording a change</h3>
        <p class="text-xs text-slate-500 mb-4">${label}: <span class="text-slate-400">${oldValue ?? "\u2014"}</span> \u2192 <b>${newValue}</b></p>
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label class="text-xs text-slate-500">Takes effect from</label>
            <input id="ch-date" type="date" value="${new Date().toISOString().slice(0,10)}"
                   class="w-full mt-1 border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
          </div>
          <div>
            <label class="text-xs text-slate-500">What kind of change</label>
            <div class="mt-2 space-y-1 text-sm">
              <label class="flex items-center gap-2"><input type="radio" name="ch-kind" value="change" checked /> The value changed</label>
              <label class="flex items-center gap-2"><input type="radio" name="ch-kind" value="correction" /> Fixing an error</label>
            </div>
          </div>
        </div>
        <div class="mb-4">
          <label class="text-xs text-slate-500">Note (optional)</label>
          <input id="ch-note" placeholder="e.g. price rise agreed with Sysco"
                 class="w-full mt-1 border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
        </div>
        <p class="text-xs text-slate-500 mb-4">Fixing an error rewrites that period rather than starting a new one, so past reports come out right.</p>
        <div class="flex items-center justify-between border-t border-slate-100 pt-3">
          <label class="flex items-center gap-2 text-xs text-slate-600">
            <input id="ch-quiet" type="checkbox" /> Stop asking for 30 minutes, treating everything as
            <select id="ch-quiet-kind" class="border border-slate-300 rounded px-1 py-0.5 text-xs">
              <option value="change">changes</option>
              <option value="correction">corrections</option>
            </select>
          </label>
          <div class="flex gap-2">
            <button id="ch-cancel" class="text-sm px-3 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50">Cancel</button>
            <button id="ch-save" class="text-sm px-3 py-1.5 rounded-md bg-slate-900 text-white hover:bg-slate-800">Save</button>
          </div>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    const close = (v) => { document.body.removeChild(wrap); resolve(v); };
    wrap.querySelector("#ch-cancel").onclick = () => close(null);
    wrap.querySelector("#ch-save").onclick = () => {
      const kind = wrap.querySelector('input[name="ch-kind"]:checked').value;
      if (wrap.querySelector("#ch-quiet").checked) {
        sessionMode = { kind: wrap.querySelector("#ch-quiet-kind").value, until: Date.now() + 30 * 60 * 1000 };
      }
      close({ date: wrap.querySelector("#ch-date").value, kind, note: wrap.querySelector("#ch-note").value });
    };
    wrap.onclick = (e) => { if (e.target === wrap) close(null); };
  });
}

// Records the change and applies it. `apply` is called to update the live table.
// Returns true if it went through, false if cancelled.
async function changeWithHistory({ entityType, entityKey, field, label, oldValue, newValue, apply }) {
  const prior = await historyFor(entityType, entityKey, field);
  const live = prior.filter((h) => !h.superseded_at);

  let details = { date: new Date().toISOString().slice(0, 10), kind: "change", note: "First entry" };
  if (live.length) {
    details = await askChangeDetails(label, oldValue, newValue);
    if (!details) return false;
  }

  if (details.kind === "correction" && live.length) {
    // rewrite the period: mark the standing row superseded, new row takes its dates
    const target = live.find((h) => h.valid_to === null) || live[0];
    await sb.from("value_history").update({
      superseded_at: new Date().toISOString(),
      superseded_by: "app user",
    }).eq("id", target.id);
    await sb.from("value_history").insert({
      entity_type: entityType, entity_key: entityKey, field, label,
      value_num: newValue, valid_from: target.valid_from, valid_to: target.valid_to,
      correction_of: target.id, changed_by: "app user",
      note: details.note || `Corrected \u2014 was ${oldValue}`,
    });
  } else {
    // a real change: close the standing row the day before, open a new one
    const open = live.find((h) => h.valid_to === null);
    if (open && details.date <= open.valid_from) {
      // effective on or before the standing row even started, so that version
      // never really applied -- supersede it rather than leave a period that
      // ends before it begins
      await sb.from("value_history").update({
        superseded_at: new Date().toISOString(),
        superseded_by: "app user",
      }).eq("id", open.id);
      await sb.from("value_history").insert({
        entity_type: entityType, entity_key: entityKey, field, label,
        value_num: newValue, valid_from: details.date, valid_to: open.valid_to,
        correction_of: open.id, changed_by: "app user",
        note: details.note || `Replaced \u2014 was ${oldValue}`,
      });
      await apply();
      return true;
    }
    if (open) {
      const dayBefore = new Date(details.date);
      dayBefore.setDate(dayBefore.getDate() - 1);
      await sb.from("value_history").update({ valid_to: dayBefore.toISOString().slice(0, 10) }).eq("id", open.id);
    }
    await sb.from("value_history").insert({
      entity_type: entityType, entity_key: entityKey, field, label,
      value_num: newValue, valid_from: details.date, changed_by: "app user",
      note: details.note || null,
    });
  }
  await apply();
  return true;
}

function historyTable(rows) {
  if (!rows.length) return `<p class="text-xs text-slate-400">No history recorded yet.</p>`;
  return `<table class="w-full text-xs">
    <thead><tr class="text-left text-slate-500 border-b border-slate-100">
      <th class="font-normal pb-1">Value</th><th class="font-normal pb-1">Period</th>
      <th class="font-normal pb-1">Note</th><th class="font-normal pb-1">Changed by</th>
    </tr></thead><tbody>
    ${rows.map((h) => {
      const dead = !!h.superseded_at;
      const period = `${h.valid_from}${h.valid_to ? " \u2192 " + h.valid_to : " \u2192 now"}`;
      return `<tr class="border-b border-slate-50 ${dead ? "opacity-50" : ""}">
        <td class="py-1 ${dead ? "line-through" : "font-medium"}">${h.value_num ?? h.value_text ?? ""}</td>
        <td class="py-1 text-slate-600">${period}</td>
        <td class="py-1 ${dead ? "text-red-600" : "text-slate-600"}">${dead ? "Superseded by a correction" : (h.note || "")}</td>
        <td class="py-1 text-slate-500">${h.changed_by || ""} \u00b7 ${(h.changed_at || "").slice(0,10)}</td>
      </tr>`;
    }).join("")}
    </tbody></table>`;
}

// ---------- cost calculation ----------
async function costBuildUp(productCode) {
  const product = state.products.find((p) => p.code === productCode);
  if (!product) return null;
  const site = product.site_id;

  const { data: costs } = await sb.from("product_costs").select("*").eq("product_code", productCode);
  const ingredientRow = (costs || []).find((c) => c.cost_type === "ingredient");
  const packagingRow = (costs || []).find((c) => c.cost_type === "packaging");

  async function tierValue(row, costType) {
    if (!row) return { value: 0, tier: "placeholder", note: "No cost entered yet" };
    if (row.tier === "recipe") {
      const { data: lines } = await sb
        .from("recipe_lines")
        .select("quantity_per_batch, material_code")
        .eq("product_code", productCode);
      const total = (lines || []).reduce((s, l) => {
        const c = state.materialCosts[l.material_code];
        return s + (l.quantity_per_batch || 0) * (c ? Number(c.cost_per_unit) : 0);
      }, 0);
      const withWastage = costType === "ingredient" ? total * (1 + (product.wastage_pct || 0)) : total;
      return { value: withWastage, tier: "recipe", note: "From recipe" };
    }
    return { value: row.value || 0, tier: row.tier, note: row.tier === "confirmed" ? (row.source || "Confirmed") : `Estimated by ${row.entered_by || "?"} (${row.entered_at ? row.entered_at.slice(0, 10) : "?"})` };
  }

  const ingredient = await tierValue(ingredientRow, "ingredient");
  const packaging = await tierValue(packagingRow, "packaging");

  // labour + units produced (site-specific)
  let labourValue = 0, unitsProduced = 0, labourNote = "No labour data yet";
  if (site === "kilcoole") {
    const { data: periods } = await sb
      .from("kilcoole_labour_periods")
      .select("*")
      .eq("product_code", productCode)
      .order("created_at", { ascending: false })
      .limit(1);
    if (periods && periods.length) {
      const p = periods[0];
      unitsProduced = p.quantity_produced;
      labourValue = p.total_labour_cost / p.quantity_produced;
      labourNote = `${money(p.total_labour_cost)} \u00f7 ${p.quantity_produced} units (${p.period_label})`;
    }
  } else {
    const [{ data: phases }, { data: outputRows }] = await Promise.all([
      sb.from("stillorgan_labour_phases").select("*").eq("product_code", productCode),
      sb.from("stillorgan_expected_output").select("*").eq("product_code", productCode).limit(1),
    ]);
    const output = outputRows && outputRows[0] ? outputRows[0].expected_output : 0;
    if (phases && phases.length && output) {
      const total = phases.reduce((s, ph) => s + ph.hours * ph.rate_per_hour, 0);
      unitsProduced = output;
      labourValue = total / output;
      labourNote = phases.map((ph) => `${ph.phase_name} ${ph.hours}h\u00d7${money(ph.rate_per_hour)}`).join(" + ") + ` \u00f7 ${output} expected output`;
    }
  }

  // overhead rates (mode-aware)
  const { data: ohRows } = await sb.from("overhead_rates").select("*").eq("site_id", site).eq("mode", state.mode);
  const oh = {};
  (ohRows || []).forEach((r) => { oh[r.cost_type] = r.avg_monthly_units ? r.monthly_cost / r.avg_monthly_units : 0; });

  // fixed overhead: site's monthly allocation / site's average monthly units.
  // Same volume basis as electricity, gas, cleaning and maintenance, so the
  // answer doesn't shift depending on whether labour is logged weekly or monthly.
  const { data: fixedRows } = await sb.from("fixed_costs").select("*");
  let fixedAllocated = 0;
  (fixedRows || []).forEach((r) => {
    const sPct = r.stillorgan_pct ?? 0.5;
    fixedAllocated += r.monthly_amount * (site === "stillorgan" ? sPct : (1 - sPct));
  });
  const monthlyUnits = (ohRows || []).reduce((n, r) => n || r.avg_monthly_units, 0);
  const fixedOHPerUnit = monthlyUnits ? fixedAllocated / monthlyUnits : 0;

  // storage
  const { data: storageSettings } = await sb.from("storage_settings").select("*").single();
  const storageValue = product.storage_rate_override ?? storageSettings?.default_rate ?? 0;

  const lines = [
    { label: "Ingredient", value: ingredient.value, tier: ingredient.tier, note: ingredient.note },
    { label: "Packaging", value: packaging.value, tier: packaging.tier, note: packaging.note },
    { label: "Labour", value: labourValue, tier: "calculated", note: labourNote },
    { label: "Electricity", value: oh.electricity || 0, tier: "overhead" },
    { label: "Gas", value: oh.gas || 0, tier: "overhead" },
    { label: "Cleaning", value: oh.cleaning || 0, tier: "overhead" },
    { label: "Maintenance", value: oh.maintenance || 0, tier: "overhead" },
    { label: "Fixed overhead", value: fixedOHPerUnit, tier: "overhead" },
    { label: "Storage", value: storageValue, tier: "overhead" },
  ];
  const total = lines.reduce((s, l) => s + l.value, 0);
  return { product, lines, total };
}

// ---------- rendering ----------
function tierBadge(tier, note) {
  if (tier === "calculated" || tier === "overhead") return "";
  const cls = "tier-" + tier;
  const label = tier === "recipe" ? "From recipe" : tier === "confirmed" ? "Confirmed" : "Estimated";
  return `<span class="text-xs px-2 py-0.5 rounded border ${cls}" title="${note || ""}">${label}</span>`;
}

async function renderPricing() {
  const container = el("app");
  const product = state.products.find((p) => p.code === state.productCode);
  const customer = state.customers.find((c) => c.id === state.customerId);
  if (!product || !customer) {
    container.innerHTML = renderShell(`<p class="text-sm text-slate-500">Add at least one product and one customer first (see the Products / Customers tabs).</p>`);
    return;
  }
  const build = await costBuildUp(state.productCode);
  const listPrice = product.selling_price || 0;
  const netPrice = listPrice * (1 - customer.rebate_pct);
  const contribution = netPrice - build.total - customer.delivery_rate;
  const margin = netPrice ? contribution / netPrice : 0;

  const priceUsed = state.testPrice ? parseFloat(state.testPrice) : listPrice;
  const netAtTest = priceUsed * (1 - customer.rebate_pct);
  const contribAtTest = netAtTest - build.total - customer.delivery_rate;
  const marginAtTest = netAtTest ? contribAtTest / netAtTest : 0;
  const volumeNum = parseFloat(state.testVolume) || 0;

  const prodQuery = state.productQuery ?? `${product.code} \u2014 ${product.description}`;
  const custQuery = state.customerQuery ?? customer.name;
  const prodMatches = state.productQuery
    ? state.products.filter((p) => `${p.code} ${p.description}`.toLowerCase().includes(state.productQuery.toLowerCase())).slice(0, 12)
    : [];
  const custMatches = state.customerQuery
    ? state.customers.filter((c) => c.name.toLowerCase().includes(state.customerQuery.toLowerCase())).slice(0, 12)
    : [];
  const prodDropdown = prodMatches.length
    ? `<div class="absolute z-10 w-full bg-white border border-slate-200 rounded-md mt-1 shadow-sm max-h-60 overflow-y-auto">
        ${prodMatches.map((p) => `<div data-pick-product="${p.code}" class="px-2 py-1.5 text-sm hover:bg-slate-100 cursor-pointer">${p.code} \u2014 ${p.description}</div>`).join("")}
      </div>` : "";
  const custDropdown = custMatches.length
    ? `<div class="absolute z-10 w-full bg-white border border-slate-200 rounded-md mt-1 shadow-sm max-h-60 overflow-y-auto">
        ${custMatches.map((c) => `<div data-pick-customer="${c.id}" class="px-2 py-1.5 text-sm hover:bg-slate-100 cursor-pointer">${c.name}</div>`).join("")}
      </div>` : "";

  const costLines = build.lines.map((l) => `
    <div class="flex items-center justify-between text-sm py-0.5">
      <span class="flex items-center gap-2 text-slate-600">${l.label} ${tierBadge(l.tier, l.note)}</span>
      <span class="tabular-nums">${money4(l.value)}</span>
    </div>`).join("");

  const basketRowsHtml = await renderBasketRows();

  container.innerHTML = renderShell(`
    <div class="grid grid-cols-2 gap-6">
      <div class="bg-white border border-slate-200 rounded-xl p-5 space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div class="relative">
            <label class="text-xs text-slate-500">Product</label>
            <input id="sel-product" type="text" value="${prodQuery.replace(/"/g, "&quot;")}" placeholder="Type a code or name\u2026" autocomplete="off" class="w-full mt-1 border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
            ${prodDropdown}
          </div>
          <div class="relative">
            <label class="text-xs text-slate-500">Customer</label>
            <input id="sel-customer" type="text" value="${custQuery.replace(/"/g, "&quot;")}" placeholder="Type a customer name\u2026" autocomplete="off" class="w-full mt-1 border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
            ${custDropdown}
          </div>
        </div>
        <p class="text-xs text-slate-500 capitalize">${product.site_id} \u00b7 mode: ${state.mode}</p>
        <div class="border-t border-slate-100 pt-2">${costLines}
          <div class="flex justify-between text-sm font-medium border-t border-slate-100 pt-1.5 mt-1">
            <span>Total variable cost / unit</span><span class="tabular-nums">${money(build.total)}</span>
          </div>
        </div>
        <div class="border-t border-slate-100 pt-2 space-y-1 text-sm">
          <div class="flex justify-between"><span class="text-slate-600">List price</span><span>${money(listPrice)}</span></div>
          <div class="flex justify-between"><span class="text-slate-600">Rebate</span><span>${pct(customer.rebate_pct)}</span></div>
          <div class="flex justify-between"><span class="text-slate-600">Delivery</span><span>${money4(customer.delivery_rate)}</span></div>
          <div class="flex justify-between font-medium"><span>Net price</span><span>${money(netPrice)}</span></div>
          <div class="flex justify-between font-medium"><span>Contribution</span><span class="${contribution < 0 ? "text-red-600" : "text-emerald-600"}">${money(contribution)}</span></div>
          <div class="flex justify-between font-medium"><span>Margin</span><span class="${margin < 0 ? "text-red-600" : "text-emerald-600"}">${pct(margin)}</span></div>
        </div>
        <button id="btn-add-basket" class="w-full text-sm bg-slate-900 text-white rounded-md py-2 hover:bg-slate-800">Add to quote basket</button>
      </div>

      <div class="bg-white border border-slate-200 rounded-xl p-5 space-y-3">
        <h2 class="text-sm font-medium text-slate-700">Test a different price</h2>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs text-slate-500">Test price</label>
            <input id="in-test-price" type="number" step="0.01" value="${state.testPrice}" placeholder="${listPrice.toFixed(2)}" class="w-full mt-1 border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
          <div><label class="text-xs text-slate-500">Test volume</label>
            <input id="in-test-volume" type="number" value="${state.testVolume}" placeholder="0" class="w-full mt-1 border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        </div>
        <div class="space-y-1 text-sm">
          <div class="flex justify-between"><span class="text-slate-600">Price used</span><span>${money(priceUsed)}</span></div>
          <div class="flex justify-between"><span class="text-slate-600">Net price at test</span><span>${money(netAtTest)}</span></div>
          <div class="flex justify-between font-medium"><span>Contribution / unit</span><span class="${contribAtTest < 0 ? "text-red-600" : "text-emerald-600"}">${money(contribAtTest)}</span></div>
          <div class="flex justify-between font-medium"><span>Margin at test</span><span class="${marginAtTest < 0 ? "text-red-600" : "text-emerald-600"}">${pct(marginAtTest)}</span></div>
          ${volumeNum > 0 ? `<div class="flex justify-between font-medium border-t border-slate-100 pt-1"><span>Total contribution at volume</span><span>${money(contribAtTest * volumeNum)}</span></div>` : ""}
        </div>
      </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-xl p-5 mt-6">
      <h2 class="text-sm font-medium text-slate-700 mb-3">Quote basket</h2>
      ${basketRowsHtml}
    </div>
  `);

  const prodInput = el("sel-product");
  prodInput.oninput = (e) => {
    state.productQuery = e.target.value;
    const caret = e.target.selectionStart;
    renderPricing().then(() => {
      const again = el("sel-product");
      if (again) { again.focus(); again.setSelectionRange(caret, caret); }
    });
  };
  const custInput = el("sel-customer");
  custInput.oninput = (e) => {
    state.customerQuery = e.target.value;
    const caret = e.target.selectionStart;
    renderPricing().then(() => {
      const again = el("sel-customer");
      if (again) { again.focus(); again.setSelectionRange(caret, caret); }
    });
  };
  document.querySelectorAll("[data-pick-product]").forEach((d) => {
    d.onmousedown = (ev) => {
      ev.preventDefault();
      state.productCode = d.dataset.pickProduct;
      state.productQuery = null;
      renderPricing();
    };
  });
  document.querySelectorAll("[data-pick-customer]").forEach((d) => {
    d.onmousedown = (ev) => {
      ev.preventDefault();
      state.customerId = d.dataset.pickCustomer;
      state.customerQuery = null;
      renderPricing();
    };
  });
  el("in-test-price").oninput = (e) => { state.testPrice = e.target.value; renderPricing(); };
  el("in-test-volume").oninput = (e) => { state.testVolume = e.target.value; renderPricing(); };
  el("btn-add-basket").onclick = () => {
    state.basket.push({ id: Date.now(), productCode: state.productCode, customerId: state.customerId, quantity: 100, discount: 0 });
    renderPricing();
  };
  document.querySelectorAll("[data-remove-basket]").forEach((b) => {
    b.onclick = () => { state.basket = state.basket.filter((l) => l.id != b.dataset.removeBasket); renderPricing(); };
  });
  document.querySelectorAll("[data-basket-qty]").forEach((inp) => {
    inp.onchange = () => {
      const line = state.basket.find((l) => l.id == inp.dataset.basketQty);
      if (line) line.quantity = parseFloat(inp.value) || 0;
      renderPricing();
    };
  });
  document.querySelectorAll("[data-basket-discount]").forEach((inp) => {
    inp.onchange = () => {
      const line = state.basket.find((l) => l.id == inp.dataset.basketDiscount);
      if (line) line.discount = (parseFloat(inp.value) || 0) / 100;
      renderPricing();
    };
  });
}

async function renderBasketRows() {
  if (!state.basket.length) return `<p class="text-sm text-slate-400">No lines yet.</p>`;
  const rows = [];
  let totalValue = 0, totalQty = 0, totalCostQty = 0, totalDeliveryQty = 0;
  for (const line of state.basket) {
    const product = state.products.find((p) => p.code === line.productCode);
    const customer = state.customers.find((c) => c.id === line.customerId);
    const build = await costBuildUp(line.productCode);
    const finalPrice = (product.selling_price || 0) * (1 - customer.rebate_pct) * (1 - (line.discount || 0));
    const contrib = finalPrice - build.total - customer.delivery_rate;
    const marginPct = finalPrice ? contrib / finalPrice : 0;
    const lineValue = finalPrice * line.quantity;
    totalValue += lineValue; totalQty += line.quantity;
    totalCostQty += build.total * line.quantity;
    totalDeliveryQty += customer.delivery_rate * line.quantity;
    rows.push(`<tr class="border-b border-slate-50">
      <td class="py-2">${product.description}</td>
      <td class="py-2">${customer.name}</td>
      <td class="py-2 text-right"><input data-basket-qty="${line.id}" type="number" value="${line.quantity}" class="w-16 border border-slate-200 rounded px-1 py-0.5 text-right text-sm" /></td>
      <td class="py-2 text-right"><input data-basket-discount="${line.id}" type="number" step="0.01" value="${((line.discount || 0) * 100).toFixed(2).replace(/\.00$/, "")}" class="w-14 border border-slate-200 rounded px-1 py-0.5 text-right text-sm" /></td>
      <td class="py-2 text-right tabular-nums text-sm">${money(finalPrice)}</td>
      <td class="py-2 text-right tabular-nums text-sm">${money(build.total)}</td>
      <td class="py-2 text-right tabular-nums text-sm ${marginPct < 0 ? "text-red-600" : "text-emerald-600"}">${pct(marginPct)}</td>
      <td class="py-2 text-right tabular-nums text-sm">${money(lineValue)}</td>
      <td class="py-2 text-right"><button data-remove-basket="${line.id}" class="text-xs text-slate-400 hover:text-red-600">remove</button></td>
    </tr>`);
  }
  const blendedMargin = totalValue ? (totalValue - totalCostQty - totalDeliveryQty) / totalValue : 0;
  return `
    <div class="text-xs text-slate-500 mb-2">${totalQty.toLocaleString()} units \u00b7 blended margin ${pct(blendedMargin)}</div>
    <table class="w-full text-sm">
      <thead><tr class="text-left text-xs text-slate-500 border-b border-slate-100">
        <th class="font-normal pb-2">Product</th><th class="font-normal pb-2">Customer</th>
        <th class="font-normal pb-2 text-right">Qty</th><th class="font-normal pb-2 text-right">Discount %</th>
        <th class="font-normal pb-2 text-right">Final price</th><th class="font-normal pb-2 text-right">Cost</th>
        <th class="font-normal pb-2 text-right">Margin</th><th class="font-normal pb-2 text-right">Line value</th><th></th>
      </tr></thead>
      <tbody>${rows.join("")}</tbody>
    </table>`;
}

function renderShell(inner) {
  const tabs = ["pricing", "products", "customers", "materials", "purchases", "costs", "recipes", "labour", "settings", "import"];
  const tabBtns = tabs.map((t) => `<button data-tab="${t}" class="tab-btn px-3 py-1.5 text-sm rounded-md capitalize ${state.tab === t ? "active" : "text-slate-600 hover:bg-slate-100"}">${t}</button>`).join("");
  return `
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl font-semibold">Fusco Foods pricing</h1>
        <p class="text-sm text-slate-500">Connected to Supabase \u2014 live data</p>
      </div>
      <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-lg p-1">
        <button data-mode="actual" class="px-3 py-1.5 text-sm rounded-md ${state.mode === "actual" ? "bg-slate-900 text-white" : "text-slate-600 hover:bg-slate-100"}">Actual</button>
        <button data-mode="budgeted" class="px-3 py-1.5 text-sm rounded-md ${state.mode === "budgeted" ? "bg-slate-900 text-white" : "text-slate-600 hover:bg-slate-100"}">Budgeted</button>

    ${inner}

}

function attachShellHandlers() {
  document.querySelectorAll("[data-tab]").forEach((b) => {
    b.onclick = () => { state.tab = b.dataset.tab; render(); };
  });
  document.querySelectorAll("[data-mode]").forEach((b) => {
    b.onclick = () => { state.mode = b.dataset.mode; render(); };

}

            <datalist id="supplier-list">${state.suppliers.map((s) => `<option value="${s.account_ref} \u2014 ${s.name.replace(/"/g, "&quot;")}"></option>`).join("")}</datalist>
          </div>
        </div>
        <div class="grid grid-cols-5 gap-3 items-end">
          <div><label class="text-xs text-slate-500">Date</label><input name="purchase_date" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
          <div><label class="text-xs text-slate-500">Pack qty</label><input name="pack_quantity" type="number" step="0.0001" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
          <div><label class="text-xs text-slate-500">Pack price \u20ac</label><input name="pack_price" type="number" step="0.0001" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
          <div><label class="text-xs text-slate-500">Invoice ref (optional)</label><input id="in-invoice-ref" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
          <button class="bg-slate-900 text-white rounded-md py-1.5 text-sm">Add</button>
        </div>
      </form>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <table class="w-full"><thead><tr class="text-left text-xs text-slate-500 border-b border-slate-100">
        <th class="font-normal pb-2">Date</th><th class="font-normal pb-2">Material</th><th class="font-normal pb-2">Supplier</th>
        <th class="font-normal pb-2 text-right">Pack qty</th><th class="font-normal pb-2 text-right">Pack price</th>
        <th class="font-normal pb-2 text-right">\u20ac/unit</th><th class="font-normal pb-2">Invoice</th><th></th>
      </tr></thead><tbody>${rows || `<tr><td colspan="8" class="py-3 text-sm text-slate-400">No purchases recorded yet.</td></tr>`}</tbody></table>
    </div>`);
  attachShellHandlers();

  el("form-purchase").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const raw = (f.get("supplier_ref") || "").trim();
    const ref = raw.split("\u2014")[0].trim();
    const match = state.suppliers.find((s) => s.account_ref === ref)
      || state.suppliers.find((s) => s.name.toLowerCase() === raw.toLowerCase());
    await sb.from("material_purchases").insert({
      material_code: f.get("material_code"),
      supplier_ref: match ? match.account_ref : null,
      supplier: match ? match.name : (raw || null),
      purchase_date: f.get("purchase_date"),
      pack_quantity: parseFloat(f.get("pack_quantity")),
      pack_price: parseFloat(f.get("pack_price")),
      invoice_ref: el("in-invoice-ref").value || null,
    });
    el("in-invoice-ref").value = "";
    state.materialHistory = {};
    await loadAll(); renderPurchases();
  };
  document.querySelectorAll("[data-del-purchase]").forEach((b) => {
    b.onclick = async () => {
      await sb.from("material_purchases").delete().eq("id", b.dataset.delPurchase);
      await loadAll(); renderPurchases();
    };
  });
}

// ---------- Costs tab: the three-tier ingredient/packaging cost ----------
async function renderCosts() {
  const { data: allCosts } = await sb.from("product_costs").select("*");
  const costFor = (code, type) => (allCosts || []).find((c) => c.product_code === code && c.cost_type === type);

  const rows = state.products.map((p) => {
    const ing = costFor(p.code, "ingredient");
    const pkg = costFor(p.code, "packaging");
    const cell = (row, type) => {
      if (!row) return `<span class="text-slate-400 text-xs">not set</span>`;
      const badge = tierBadge(row.tier, row.source || row.entered_by || "");
      const val = row.tier === "recipe" ? `<span class="text-xs text-slate-500">from recipe</span>` : money4(row.value || 0);
      const promote = row.tier === "placeholder"
        ? `<button data-promote="${p.code}:${type}" class="text-xs text-blue-600 hover:underline ml-2">confirm</button>` : "";
      return `${val} ${badge}${promote}`;
    };
    return `<tr class="border-b border-slate-50 text-sm">
      <td class="py-2">${p.code}</td>
      <td class="py-2">${p.description}</td>
      <td class="py-2">${cell(ing, "ingredient")}</td>
      <td class="py-2">${cell(pkg, "packaging")}</td>
      <td class="py-2 text-right">${pct(p.wastage_pct || 0)}</td>
    </tr>`;
  }).join("");

  const productOpts = state.products.map((p) => `<option value="${p.code}">${p.code} \u2014 ${p.description}</option>`).join("");

  el("app").innerHTML = renderShell(`
    <div class="bg-white border border-slate-200 rounded-xl p-5 mb-6">
      <h2 class="text-sm font-medium mb-1">Set a cost</h2>
      <p class="text-xs text-slate-500 mb-3">Choose "From recipe" to calculate from the Recipes tab instead of typing a figure. "Estimated" is a rough guess and is flagged everywhere it's used.</p>
      <form id="form-cost" class="grid grid-cols-8 gap-2 items-end">
        <div class="col-span-3"><label class="text-xs text-slate-500">Product</label><select name="product_code" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm">${productOpts}</select></div>
        <div><label class="text-xs text-slate-500">Cost type</label><select name="cost_type" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm"><option value="ingredient">Ingredient</option><option value="packaging">Packaging</option></select></div>
        <div><label class="text-xs text-slate-500">Tier</label><select name="tier" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm"><option value="confirmed">Confirmed</option><option value="placeholder">Estimated</option><option value="recipe">From recipe</option></select></div>
        <div><label class="text-xs text-slate-500">Value \u20ac/unit</label><input name="value" type="number" step="0.0001" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-500">Source / who</label><input name="source" placeholder="e.g. Alex sheet" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <button class="bg-slate-900 text-white rounded-md py-1.5 text-sm">Save</button>
      </form>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-5 mb-6">
      <h2 class="text-sm font-medium mb-3">Wastage % (applies to recipe-costed ingredients)</h2>
      <form id="form-wastage" class="grid grid-cols-5 gap-2 items-end">
        <div class="col-span-3"><label class="text-xs text-slate-500">Product</label><select name="product_code" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm">${productOpts}</select></div>
        <div><label class="text-xs text-slate-500">Wastage %</label><input name="wastage_pct" type="number" step="0.01" placeholder="3" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <button class="bg-slate-900 text-white rounded-md py-1.5 text-sm">Save</button>
      </form>
    </div>
    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <table class="w-full"><thead><tr class="text-left text-xs text-slate-500 border-b border-slate-100">
        <th class="font-normal pb-2">Code</th><th class="font-normal pb-2">Product</th>
        <th class="font-normal pb-2">Ingredient</th><th class="font-normal pb-2">Packaging</th><th class="font-normal pb-2 text-right">Wastage</th>
      </tr></thead><tbody>${rows}</tbody></table>
    </div>`);
  attachShellHandlers();

  el("form-cost").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const tier = f.get("tier");
    await sb.from("product_costs").upsert({
      product_code: f.get("product_code"),
      cost_type: f.get("cost_type"),
      tier: tier,
      value: tier === "recipe" ? null : (parseFloat(f.get("value")) || 0),
      source: tier === "confirmed" ? (f.get("source") || null) : null,
      entered_by: tier === "placeholder" ? (f.get("source") || null) : null,
      confirmed_by: null, confirmed_at: null,
    }, { onConflict: "product_code,cost_type" });
    renderCosts();
  };
  el("form-wastage").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await sb.from("products").update({ wastage_pct: (parseFloat(f.get("wastage_pct")) || 0) / 100 }).eq("code", f.get("product_code"));
    await loadAll(); renderCosts();
  };
  document.querySelectorAll("[data-promote]").forEach((b) => {
    b.onclick = async () => {
      const [code, type] = b.dataset.promote.split(":");
      await sb.from("product_costs").update({ tier: "confirmed", confirmed_by: "app user", confirmed_at: new Date().toISOString() })
        .eq("product_code", code).eq("cost_type", type);
      renderCosts();
    };
  });
}

// ---------- Recipes tab ----------
async function renderRecipes() {
  // which products actually have a recipe
  const { data: allLines } = await sb.from("recipe_lines").select("product_code, material_code");
  const counts = {};
  (allLines || []).forEach((l) => { counts[l.product_code] = (counts[l.product_code] || 0) + 1; });

  if (!state.recipeProduct) {
    const withRecipe = Object.keys(counts);
    state.recipeProduct = withRecipe.length ? withRecipe.sort()[0] : (state.products[0] && state.products[0].code);
  }
  const code = state.recipeProduct;
  const product = state.products.find((p) => p.code === code);

  // this product's lines
  const { data: lines } = await sb.from("recipe_lines")
    .select("*, materials(description, uom_code)")
    .eq("product_code", code)
    .order("id");

  // batch size, from whichever labour model applies
  let batch = 0, batchNote = "";
  if (product && product.site_id === "kilcoole") {
    const { data: p } = await sb.from("kilcoole_labour_periods").select("*")
      .eq("product_code", code).order("created_at", { ascending: false }).limit(1);
    if (p && p.length) { batch = p[0].quantity_produced; batchNote = `from Kilcoole labour, ${p[0].period_label}`; }
  } else {
    const { data: o } = await sb.from("stillorgan_expected_output").select("*").eq("product_code", code).limit(1);
    if (o && o.length) { batch = o[0].expected_output; batchNote = "from Stillorgan expected output"; }
  }

  const ing = [], pkg = [];
  (lines || []).forEach((l) => {
    const c = state.materialCosts[l.material_code];
    const unitCost = c ? Number(c.cost_per_unit) : null;
    const row = { ...l, unitCost, lineCost: unitCost === null ? null : l.quantity_per_batch * unitCost };
    const isPkg = (state.materials.find((m) => m.code === l.material_code) || {}).uom_code === "each";
    (isPkg ? pkg : ing).push(row);
  });
  const sum = (arr) => arr.reduce((s, r) => s + (r.lineCost || 0), 0);
  const missing = (lines || []).filter((l) => !state.materialCosts[l.material_code]).length;

  const section = (title, arr) => {
    if (!arr.length) return "";
    return `<tr><td colspan="6" class="pt-3 pb-1 text-xs font-medium text-slate-500">${title}</td></tr>` +
      arr.map((l) => `<tr class="border-b border-slate-50 text-sm">
        <td class="py-1.5">${l.material_code}</td>
        <td class="py-1.5">${l.materials?.description || ""}</td>
        <td class="py-1.5 text-right">
          <input data-qty="${l.id}" type="number" step="0.0001" value="${l.quantity_per_batch}"
                 class="w-24 border border-slate-200 rounded px-1 py-0.5 text-right text-sm" />
          <span class="text-xs text-slate-400 ml-1">${l.materials?.uom_code || ""}</span>
        </td>
        <td class="py-1.5 text-right">${l.unitCost === null ? `<span class="text-amber-700 text-xs">no purchase</span>` : money4(l.unitCost)}</td>
        <td class="py-1.5 text-right">${l.lineCost === null ? "\u2014" : money(l.lineCost)}</td>
        <td class="py-1.5 text-right"><button data-del-recipe="${l.id}" class="text-xs text-slate-400 hover:text-red-600">remove</button></td>
      </tr>`).join("");
  };

  const ingTotal = sum(ing), pkgTotal = sum(pkg), total = ingTotal + pkgTotal;
  const perUnit = batch ? total / batch : null;
  const price = product?.selling_price || 0;

  const productOpts = state.products.map((p) =>
    `<option value="${p.code}" ${p.code === code ? "selected" : ""}>${p.code} \u2014 ${p.description}${counts[p.code] ? ` (${counts[p.code]})` : ""}</option>`).join("");
  const materialOpts = state.materials.map((m) =>
    `<option value="${m.code}">${m.code} \u2014 ${m.description}${m.uom_code ? " (" + m.uom_code + ")" : ""}</option>`).join("");

  el("app").innerHTML = renderShell(`
    <div class="bg-white border border-slate-200 rounded-xl p-5 mb-6">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-slate-500">Product</label>
          <select id="sel-recipe-product" class="w-full mt-1 border border-slate-300 rounded-md px-2 py-1.5 text-sm">${productOpts}</select>
          <p class="text-xs text-slate-500 mt-1">The number in brackets is how many recipe lines that product already has.</p>
        </div>
        <div class="text-sm">
          <p class="text-xs text-slate-500">Batch size</p>
          <p class="font-medium">${batch ? `${batch.toLocaleString()} units` : `<span class="text-amber-700">not set</span>`}
            <span class="text-xs text-slate-500 font-normal">${batchNote}</span></p>
          <p class="text-xs text-slate-500 mt-1">${product?.site_id === "kilcoole"
            ? "Set on the Labour tab, under Kilcoole period labour."
            : "Set on the Labour tab, under Stillorgan expected output."}</p>
        </div>
      </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-xl p-5 mb-6">
      <h2 class="text-sm font-medium mb-3">${product ? product.description : ""}</h2>
      ${(lines || []).length ? `
      <table class="w-full">
        <thead><tr class="text-left text-xs text-slate-500 border-b border-slate-100">
          <th class="font-normal pb-2">Code</th><th class="font-normal pb-2">Material</th>
          <th class="font-normal pb-2 text-right">Qty per batch</th>
          <th class="font-normal pb-2 text-right">Cost/unit</th>
          <th class="font-normal pb-2 text-right">Line cost</th><th></th>
        </tr></thead>
        <tbody>
          ${section("Ingredients", ing)}
          ${ing.length ? `<tr class="text-sm"><td colspan="4" class="py-1 text-right text-slate-500">Ingredients per batch</td><td class="py-1 text-right font-medium">${money(ingTotal)}</td><td></td></tr>` : ""}
          ${section("Packaging", pkg)}
          ${pkg.length ? `<tr class="text-sm"><td colspan="4" class="py-1 text-right text-slate-500">Packaging per batch</td><td class="py-1 text-right font-medium">${money(pkgTotal)}</td><td></td></tr>` : ""}
          <tr class="text-sm border-t border-slate-200">
            <td colspan="4" class="py-2 text-right font-medium">Total per batch</td>
            <td class="py-2 text-right font-medium">${money(total)}</td><td></td>
          </tr>
          ${batch ? `<tr class="text-sm">
            <td colspan="4" class="py-1 text-right text-slate-500">Per unit (\u00f7 ${batch.toLocaleString()})</td>
            <td class="py-1 text-right font-medium">${money4(perUnit)}</td><td></td></tr>
            ${price ? `<tr class="text-sm"><td colspan="4" class="py-1 text-right text-slate-500">As a share of the \u20ac${price.toFixed(2)} selling price</td>
            <td class="py-1 text-right ${perUnit / price > 0.6 ? "text-red-600" : "text-slate-700"}">${pct(perUnit / price)}</td><td></td></tr>` : ""}
          ` : `<tr><td colspan="6" class="py-2 text-xs text-amber-700">Set a batch size to see the cost per unit.</td></tr>`}
        </tbody>
      </table>
      ${missing ? `<p class="text-xs text-amber-700 mt-3">${missing} material${missing === 1 ? " has" : "s have"} no purchase recorded, so ${missing === 1 ? "its" : "their"} cost counts as zero here. Record a purchase on the Purchases tab.</p>` : ""}
      ` : `<p class="text-sm text-slate-400">No recipe lines for this product yet.</p>`}
    </div>

    <div class="bg-white border border-slate-200 rounded-xl p-5">
      <h2 class="text-sm font-medium mb-1">Add a material to this recipe</h2>
      <p class="text-xs text-slate-500 mb-3">Quantity is per batch, in the material's own unit. For this to drive the product's cost, set its Ingredient or Packaging tier to "From recipe" on the Costs tab.</p>
      <form id="form-recipe" class="grid grid-cols-8 gap-2 items-end">
        <div class="col-span-5"><label class="text-xs text-slate-500">Material</label><select name="material_code" class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm">${materialOpts}</select></div>
        <div class="col-span-2"><label class="text-xs text-slate-500">Qty per batch</label><input name="quantity_per_batch" type="number" step="0.0001" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <button class="bg-slate-900 text-white rounded-md py-1.5 text-sm">Add</button>
      </form>
    </div>`);
  attachShellHandlers();

  el("sel-recipe-product").onchange = (e) => { state.recipeProduct = e.target.value; renderRecipes(); };
  el("form-recipe").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await sb.from("recipe_lines").upsert({
      product_code: code,
      material_code: f.get("material_code"),
      quantity_per_batch: parseFloat(f.get("quantity_per_batch")),
    }, { onConflict: "product_code,material_code" });
    renderRecipes();
  };
  document.querySelectorAll("[data-qty]").forEach((inp) => {
    inp.onchange = async () => {
      const v = parseFloat(inp.value);
      if (isNaN(v) || v <= 0) { renderRecipes(); return; }
      const line = (lines || []).find((l) => String(l.id) === inp.dataset.qty);
      if (!line || Number(line.quantity_per_batch) === v) { renderRecipes(); return; }
      await changeWithHistory({
        entityType: "recipe_lines",
        entityKey: `${code}||${line.material_code}`,
        field: "quantity_per_batch",
        label: `${code} / ${line.material_code} quantity per batch`,
        oldValue: line.quantity_per_batch,
        newValue: v,
        apply: () => sb.from("recipe_lines").update({ quantity_per_batch: v }).eq("id", line.id),
      });
      renderRecipes();
    };
  });
  document.querySelectorAll("[data-del-recipe]").forEach((b) => {
    b.onclick = async () => { await sb.from("recipe_lines").delete().eq("id", b.dataset.delRecipe); renderRecipes(); };
  });
}

      <form id="form-kc" class="grid grid-cols-7 gap-2 items-end">
        <div class="col-span-3"><label class="text-xs text-slate-500">Product</label><select name="product_code" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm">${kcOpts || "<option value=''>No Kilcoole products</option>"}</select></div>
        <div><label class="text-xs text-slate-500">Period</label><input name="period_label" placeholder="w/c 01/06/26" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-500">Qty produced</label><input name="quantity_produced" type="number" step="1" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-500">Total labour \u20ac</label><input name="total_labour_cost" type="number" step="0.01" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], next = text[i + 1];
    if (inQuotes) {
      if (ch === '"' && next === '"') { field += '"'; i++; }
      else if (ch === '"') inQuotes = false;
      else field += ch;
    } else if (ch === '"') inQuotes = true;
    else if (ch === ",") { row.push(field); field = ""; }
    else if (ch === "\r") { /* skip */ }
    else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else field += ch;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim() !== ""));
}

function downloadCSV(name, rows) {
  const csv = rows.map((r) => r.map((c) => /[",\n]/.test(c) ? '"' + String(c).replace(/"/g, '""') + '"' : c).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function analyseImport(targetKey, text) {
  const t = IMPORT_TARGETS[targetKey];
  const parsed = parseCSV(text);
  if (!parsed.length) return { error: "That file appears to be empty." };

  const header = parsed[0].map((h) => h.trim().toLowerCase());
  const missingCols = t.required.filter((c) => !header.includes(c));
  if (missingCols.length) {
    return { error: `Missing required column(s): ${missingCols.join(", ")}. Expected header: ${t.cols.join(", ")}` };
  }

  // reference data for validation
  const productCodes = new Set(state.products.map((p) => p.code));
  const materialCodes = new Set(state.materials.map((m) => m.code));
  const uomCodes = new Set(state.uoms.map((u) => u.code));
  const supplierRefs = new Set(state.suppliers.map((s) => s.account_ref));

  // what's already there
  let existing = [];
  if (t.key) {
    const { data } = await sb.from(t.table).select("*");
    existing = data || [];
  }
  const keyOf = (o) => t.key.map((k) => String(o[k] ?? "").trim().toLowerCase()).join("||");
  const existingByKey = {};
  existing.forEach((e) => { existingByKey[keyOf(e)] = e; });

  const out = [];
  for (let i = 1; i < parsed.length; i++) {
    const cells = parsed[i];
    const rec = {};
    t.cols.forEach((c) => {
      const idx = header.indexOf(c);
      rec[c] = idx >= 0 ? String(cells[idx] ?? "").trim() : "";
    });

    const errors = [];
    t.required.forEach((c) => { if (!rec[c]) errors.push(`${c} is required`); });
    t.numeric.forEach((c) => {
      if (rec[c] !== "" && isNaN(parseFloat(rec[c]))) errors.push(`${c} is not a number`);
    });
    if (rec.product_code && !productCodes.has(rec.product_code)) errors.push(`no product ${rec.product_code}`);
    if (rec.material_code && !materialCodes.has(rec.material_code)) errors.push(`no material ${rec.material_code}`);
    if (rec.uom_code && !uomCodes.has(rec.uom_code)) errors.push(`unknown unit ${rec.uom_code}`);
    if (rec.supplier_ref && !supplierRefs.has(rec.supplier_ref)) errors.push(`no supplier ${rec.supplier_ref}`);
    if (rec.site_id && !["stillorgan", "kilcoole"].includes(rec.site_id.toLowerCase())) errors.push("site must be stillorgan or kilcoole");
    if (rec.cost_type && !["ingredient", "packaging"].includes(rec.cost_type.toLowerCase())) errors.push("cost_type must be ingredient or packaging");
    if (rec.tier && !["recipe", "confirmed", "placeholder"].includes(rec.tier.toLowerCase())) errors.push("tier must be recipe, confirmed or placeholder");

    // build the payload
    const payload = {};
    t.cols.forEach((c) => {
      let v = rec[c];
      if (v === "") { payload[c] = null; return; }
      if (t.numeric.includes(c)) v = parseFloat(v);
      if (c === "rebate_pct") v = Math.round((v / 100) * 1e6) / 1e6;
      if (c === "site_id" || c === "cost_type" || c === "tier") v = String(v).toLowerCase();
      payload[c] = v;
    });

    let status = "new", changes = [];
    if (t.key && !errors.length) {
      const match = existingByKey[keyOf(rec)];
      if (match) {
        t.cols.forEach((c) => {
          if (t.key.includes(c)) return;
          const oldV = match[c], newV = payload[c];
          const same = (oldV === null || oldV === undefined ? "" : String(oldV)) === (newV === null ? "" : String(newV))
            || (typeof oldV === "number" && Number(oldV) === Number(newV));
          if (!same) changes.push({ col: c, from: oldV, to: newV });
        });
        status = changes.length ? "change" : "unchanged";
      }
    }
    if (errors.length) status = "error";
    out.push({ line: i + 1, rec, payload, status, changes, errors, selected: status === "new" || status === "change" });
  }
  return { rows: out };
}

async function renderImport() {
  const t = IMPORT_TARGETS[state.importTarget];
  const targetOpts = Object.entries(IMPORT_TARGETS)
    .map(([k, v]) => `<option value="${k}" ${k === state.importTarget ? "selected" : ""}>${v.label}</option>`).join("");

  let preview = "";
  if (state.importRows) {
    const counts = { new: 0, change: 0, unchanged: 0, error: 0 };
    state.importRows.forEach((r) => counts[r.status]++);
    const selectable = state.importRows.filter((r) => r.status !== "error" && r.status !== "unchanged");
    const allSelected = selectable.length > 0 && selectable.every((r) => r.selected);

    const rowsHtml = state.importRows.map((r, i) => {
      const badge = {
        new: '<span class="text-xs px-2 py-0.5 rounded border bg-emerald-50 text-emerald-700 border-emerald-200">New</span>',
        change: '<span class="text-xs px-2 py-0.5 rounded border bg-blue-50 text-blue-700 border-blue-200">Change</span>',
        unchanged: '<span class="text-xs px-2 py-0.5 rounded border bg-slate-50 text-slate-500 border-slate-200">No change</span>',
        error: '<span class="text-xs px-2 py-0.5 rounded border bg-red-50 text-red-700 border-red-200">Error</span>',
      }[r.status];
      const detail = r.status === "error"
        ? `<span class="text-xs text-red-600">${r.errors.join("; ")}</span>`
        : r.status === "change"
          ? r.changes.map((c) => `<span class="text-xs text-slate-600">${c.col}: <span class="text-slate-400">${c.from ?? "\u2014"}</span> \u2192 <b>${c.to ?? "\u2014"}</b></span>`).join("<br>")
          : "";
      const canSelect = r.status === "new" || r.status === "change";
      return `<tr class="border-b border-slate-50 text-sm ${r.status === "error" ? "bg-red-50/40" : ""}">
        <td class="py-1.5 pl-2">${canSelect ? `<input type="checkbox" data-imp-row="${i}" ${r.selected ? "checked" : ""} />` : ""}</td>
        <td class="py-1.5 text-xs text-slate-400">${r.line}</td>
        <td class="py-1.5">${badge}</td>
        ${t.cols.map((c) => `<td class="py-1.5 text-xs">${r.rec[c] || "\u2014"}</td>`).join("")}
        <td class="py-1.5">${detail}</td>
      </tr>`;
    }).join("");

    const selCount = state.importRows.filter((r) => r.selected).length;
    preview = `
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <div class="flex items-center justify-between mb-3">
          <p class="text-sm text-slate-600">${counts.new} new \u00b7 ${counts.change} changed \u00b7 ${counts.unchanged} unchanged \u00b7 ${counts.error} with errors</p>
          <div class="flex items-center gap-2">
            <button id="btn-imp-cancel" class="text-sm px-3 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50">Cancel</button>
            <button id="btn-imp-commit" class="text-sm px-3 py-1.5 rounded-md bg-slate-900 text-white hover:bg-slate-800 ${selCount ? "" : "opacity-40 pointer-events-none"}">Import ${selCount} row${selCount === 1 ? "" : "s"}</button>
          </div>
        </div>
        <table class="w-full">
          <thead><tr class="text-left text-xs text-slate-500 border-b border-slate-100">
            <th class="font-normal pb-2 pl-2"><input type="checkbox" id="imp-all" ${allSelected ? "checked" : ""} /></th>
            <th class="font-normal pb-2">Line</th><th class="font-normal pb-2">Status</th>
            ${t.cols.map((c) => `<th class="font-normal pb-2">${c}</th>`).join("")}
            <th class="font-normal pb-2">Detail</th>
          </tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>`;
  }

  el("app").innerHTML = renderShell(`
    <div class="bg-white border border-slate-200 rounded-xl p-5 mb-6">
      <h2 class="text-sm font-medium mb-1">Import from CSV</h2>
      <p class="text-xs text-slate-500 mb-3">Nothing is written until you review the preview and choose which rows to import.</p>
      <div class="flex items-end gap-3">
        <div>
          <label class="text-xs text-slate-500">What are you importing?</label>
          <select id="sel-import-target" class="w-full mt-1 border border-slate-300 rounded-md px-2 py-1.5 text-sm">${targetOpts}</select>
        </div>
        <button id="btn-template" class="text-sm px-3 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50">Download template</button>
        <div>
          <label class="text-xs text-slate-500">CSV file</label>
          <input id="in-csv" type="file" accept=".csv,text/csv" class="block mt-1 text-sm" />
        </div>
      </div>
      <p class="text-xs text-slate-500 mt-3">Columns: <span class="font-mono">${t.cols.join(", ")}</span></p>
      <p class="text-xs text-slate-500 mt-1">${t.note}</p>
      ${state.importMsg ? `<p class="text-sm mt-3 ${state.importMsg.startsWith("Error") ? "text-red-600" : "text-emerald-700"}">${state.importMsg}</p>` : ""}
    </div>
    ${preview}
  `);
  attachShellHandlers();

  el("sel-import-target").onchange = (e) => {
    state.importTarget = e.target.value;
    state.importRows = null; state.importMsg = "";
    renderImport();
  };
  el("btn-template").onclick = () => {
    downloadCSV(`fusco_${state.importTarget}_template.csv`, [t.cols, t.sample]);
  };
  el("in-csv").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    const result = await analyseImport(state.importTarget, text);
    if (result.error) { state.importMsg = "Error: " + result.error; state.importRows = null; }
    else { state.importRows = result.rows; state.importMsg = ""; }
    renderImport();
  };

  if (state.importRows) {
    document.querySelectorAll("[data-imp-row]").forEach((cb) => {
      cb.onchange = () => { state.importRows[cb.dataset.impRow].selected = cb.checked; renderImport(); };
    });
    el("imp-all").onchange = (e) => {
      state.importRows.forEach((r) => {
        if (r.status === "new" || r.status === "change") r.selected = e.target.checked;
      });
      renderImport();
    };
    el("btn-imp-cancel").onclick = () => { state.importRows = null; state.importMsg = ""; renderImport(); };
    el("btn-imp-commit").onclick = async () => {
      const chosen = state.importRows.filter((r) => r.selected);
      if (!chosen.length) return;
      const payloads = chosen.map((r) => r.payload);
      let err = null;
      if (t.key) {
        const res = await sb.from(t.table).upsert(payloads, { onConflict: t.key.join(",") });
        err = res.error;
      } else {
        const res = await sb.from(t.table).insert(payloads);
        err = res.error;
      }
      if (err) {
        state.importMsg = "Error: " + err.message;
      } else {
        state.importMsg = `Imported ${chosen.length} row${chosen.length === 1 ? "" : "s"} into ${t.label}.`;
        state.importRows = null;
        state.materialHistory = {};
        await loadAll();
      }
      renderImport();
    };
  }
}

async function render() {
  if (state.tab === "pricing") await renderPricing();
  else if (state.tab === "products") await renderProducts();
  else if (state.tab === "customers") await renderCustomers();
  else if (state.tab === "materials") await renderMaterials();
  else if (state.tab === "purchases") await renderPurchases();
  else if (state.tab === "costs") await renderCosts();
  else if (state.tab === "recipes") await renderRecipes();
  else if (state.tab === "labour") await renderLabour();
  else if (state.tab === "settings") await renderSettings();
  else if (state.tab === "import") await renderImport();
  attachShellHandlers();
}

(async function init() {
  el("app").innerHTML = `<p class="text-slate-500 p-6">Loading\u2026</p>`;
  await loadAll();
  await render();
})();
</script>
</body>
</html>
